<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Boot WebSocket 聊天室</title>
    <!-- SockJS: WebSocket 降级支持 -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
    <!-- STOMP.js: STOMP 协议客户端 -->
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, "Microsoft YaHei", sans-serif;
            background: #f0f2f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: #1a73e8;
            color: #fff;
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 { font-size: 18px; }
        #status {
            font-size: 13px;
            padding: 4px 12px;
            border-radius: 12px;
            background: rgba(255,255,255,.2);
        }
        #status.connected { background: #2e7d32; }
        /* 登录面板 */
        #loginPanel {
            margin: auto;
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,.08);
            text-align: center;
        }
        #loginPanel h2 { margin-bottom: 20px; font-size: 20px; }
        #username {
            width: 260px;
            padding: 10px 14px;
            border: 1px solid #d9d9d9;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        #username:focus { border-color: #1a73e8; }
        /* 聊天区域 */
        #chatPanel { display: none; flex: 1; flex-direction: column; }
        #messageArea {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 65%;
            padding: 10px 14px;
            border-radius: 10px;
            background: #fff;
            box-shadow: 0 1px 4px rgba(0,0,0,.06);
            word-break: break-word;
        }
        .message .meta { font-size: 12px; color: #888; margin-bottom: 4px; }
        .message.self { align-self: flex-end; background: #e3f2fd; }
        .message.bot { background: #fff8e1; align-self: flex-start; }
        .message.system { align-self: center; background: transparent; box-shadow: none; color: #999; font-size: 13px; }
        .message.join { align-self: center; background: #e8f5e9; color: #2e7d32; font-size: 13px; box-shadow: none; }
        .message.leave { align-self: center; background: #fbe9e7; color: #bf360c; font-size: 13px; box-shadow: none; }
        /* 输入区 */
        footer {
            display: flex;
            gap: 12px;
            padding: 16px 24px;
            background: #fff;
            border-top: 1px solid #e5e5e5;
        }
        #messageInput {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #d9d9d9;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        #messageInput:focus { border-color: #1a73e8; }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: #1a73e8;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }
        button:hover { opacity: .9; }
        button.secondary { background: #757575; }
    </style>
</head>
<body>

<!-- 登录面板 -->
<div id="loginPanel">
    <h2>👋 欢迎来到聊天室</h2>
    <input type="text" id="username" placeholder="请输入用户名" onkeydown="if(event.key==='Enter')connect()">
    <div style="margin-top:16px">
        <button onclick="connect()">进入聊天室</button>
    </div>
</div>

<!-- 聊天面板 -->
<div id="chatPanel">
    <header>
        <h1>Spring Boot WebSocket 聊天室</h1>
        <span id="status">未连接</span>
    </header>
    <div id="messageArea"></div>
    <footer>
        <input type="text" id="messageInput" placeholder="输入消息...（试试：你好、时间、帮助）" onkeydown="if(event.key==='Enter')sendMessage(event)" disabled>
        <button onclick="sendMessage(event)">发送</button>
        <button class="secondary" onclick="disconnect()">退出</button>
    </footer>
</div>

<script src="/js/chat-client.js"></script>
</body>
</html>
