server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: websocket-demo

  # Thymeleaf 配置
  thymeleaf:
    cache: false                 # 开发环境关闭缓存
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8
    mode: HTML

  # JSON 序列化配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

# 日志配置
logging:
  level:
    com.example.websocket: INFO
    # org.springframework.web.socket: DEBUG      # WebSocket 调试日志
    # org.springframework.messaging: DEBUG       # 消息调试日志
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"

# 监控端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
